<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — Wasi Mahin</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0d0b08"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<style>
@font-face {
  font-family: 'Archivo';
  font-style: normal;
  font-weight: 500 900;
  font-stretch: 125%;
  font-display: swap;
  src: url('/fonts/archivo-normal-500-900.woff2') format('woff2');
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/jetbrains-mono-normal-400.woff2') format('woff2');
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#0d0b08; --ivory:#f2ede3; --dim:rgba(242,237,227,.58); --line:rgba(242,237,227,.1); --orange:#ff4d00; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ivory);
  font-family: 'JetBrains Mono', monospace;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 24px;
}
.code {
  font-family: 'Archivo', sans-serif; font-variation-settings: 'wdth' 125;
  font-weight: 900; font-size: clamp(110px, 24vw, 260px); line-height: .9;
  letter-spacing: -.03em;
  color: transparent; -webkit-text-stroke: 2px rgba(242,237,227,.25);
}
.code em { font-style: normal; color: var(--orange); -webkit-text-stroke: 0; }
.msg { margin: 26px 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sub { font-size: 11px; letter-spacing: .08em; color: rgba(242,237,227,.34); margin-bottom: 38px; }
.home {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--bg); background: var(--orange); text-decoration: none;
  padding: 15px 26px; border-radius: 99px; transition: background-color .25s;
}
.home:hover { background: #ff6a26; }
</style>
</head>
<body>
<main>
  <div class="code">4<em>0</em>4</div>
  <p class="msg">This page doesn't exist</p>
  <p class="sub">The data says you meant to go home.</p>
  <a class="home" href="/">Back to wasimahin.com →</a>
</main>
</body>
</html>
